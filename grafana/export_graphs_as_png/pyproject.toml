[tool.poetry]
name = "export_graphs_as_png"
version = "0.1.0"
description = "Exports grafana graphs as PNG files"
authors = ["Male Michael <malmike21@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.12.0"
python-dotenv = "1.0.1"
requests = "^2.32.5"

[tool.poetry.scripts]
export-grafana-panels = "export_graphs_as_png.download_panels:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
